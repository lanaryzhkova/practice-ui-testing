name: Run Tests and Publish Allure Report

on:
  push:
    branches: [ homework ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🌐 Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-xdist allure-pytest

      - name: 🧪 Run tests (parallel)
        continue-on-error: true
        run: |
          pytest -n auto --alluredir=allure-results

      - name: 📦 Upload allure results (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  report:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 📥 Download allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: ⚙️ Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre

          curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz

          tar -xzf allure.tgz
          ls -la

          sudo rm -rf /opt/allure
          sudo mv allure-2.29.0 /opt/allure

          sudo ln -sf /opt/allure/bin/allure /usr/bin/allure

          allure --version

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report